<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무방 현황판</title>
<style>
  :root {
    --bg: #e9e7e2;
    --panel: #fbfaf7;
    --panel-2: #f3f1ec;
    --ink: #24292f;
    --muted: #6b7178;
    --line: #d9d5cc;
    --shadow: 0 1px 0 rgba(30, 36, 44, .06), 0 8px 24px rgba(30, 36, 44, .10);

    --tile: #dde1e6;
    --tile-line: #cdd3da;
    --pool: rgba(255, 255, 255, .55);
    --mat: #8b97a4;
    --wall: #f3f0e9;
    --wall-cap: #6f7a86;
    --baseboard: #cdc6b8;
    --carpet: #a7b7c8;
    --carpet-dot: #9aacbf;
    --wood: #dcbd93;
    --wood-line: #c9a77b;
    --table: #b98a5c;
    --table-edge: #8b6440;
    --coffee-table: #ece8e0;
    --coffee-edge: #c8c0b2;
    --sofa: #5f7f9a;
    --sofa-seat: #7393ad;
    --chair: #3c4551;
    --chair-seat: #4c5664;
    --chair-ink: #e8edf2;
    --laptop: #c5ccd4;
    --laptop-logo: #eef2f6;
    --screen: #a4dcff;
    --screen-off: #59636e;
    --board: #fcfdfd;
    --board-ink: #2b3743;
    --chalk: #2f4b3d;
    --frame: #9ca7b2;
    --clock: #ffffff;
    --glass: rgba(204, 224, 238, .94);
    --glass-ink: #1f2d3a;
    --door: #8b97a4;
    --plate: #fffdf8;
    --plate-edge: #d6cebf;
    --plate-ink: #2b2118;
    --plant: #4f9a5b;
    --plant-dark: #3b7a46;
    --pot: #c77a4b;
    --lamp: rgba(255, 240, 205, .45);
    --dim: rgba(46, 54, 66, .26);

    --working: #2f8a55;
    --approval: #d23f3f;
    --question: #d4820f;
    --done: #2f68b3;
    --error: #8c3a3a;
    --idle: #8f969d;
    --ended: #b4b0a8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b;
      --panel: #1f242a;
      --panel-2: #262c33;
      --ink: #e8ecf0;
      --muted: #a2abb5;
      --line: #343c45;
      --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .4);
      --tile: #252a30;
      --tile-line: #2e343b;
      --pool: rgba(255, 214, 150, .10);
      --mat: #3a434d;
      --wall: #2d333a;
      --wall-cap: #0e1114;
      --baseboard: #22272d;
      --carpet: #34424f;
      --carpet-dot: #2f3c48;
      --wood: #5b4733;
      --wood-line: #4c3b2b;
      --table: #6e4f33;
      --table-edge: #4e3824;
      --coffee-table: #3b4048;
      --coffee-edge: #2a2e34;
      --sofa: #3e5468;
      --sofa-seat: #4a6379;
      --chair: #1b2026;
      --chair-seat: #252b32;
      --chair-ink: #c9d1d9;
      --laptop: #8d959e;
      --laptop-logo: #c4cad1;
      --screen: #8fd0ff;
      --screen-off: #2b323a;
      --board: #d7dce1;
      --board-ink: #1d2731;
      --chalk: #233a2f;
      --frame: #5b6570;
      --clock: #d7dce1;
      --glass: rgba(44, 60, 76, .94);
      --glass-ink: #dce6ee;
      --door: #66727e;
      --plate: #e7e2d8;
      --plate-edge: #b9b1a3;
      --lamp: rgba(255, 210, 140, .30);
      --dim: rgba(0, 0, 0, .48);
      --idle: #7f8790;
      --ended: #5f6670;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171b;
    --panel: #1f242a;
    --panel-2: #262c33;
    --ink: #e8ecf0;
    --muted: #a2abb5;
    --line: #343c45;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .4);
    --tile: #252a30;
    --tile-line: #2e343b;
    --pool: rgba(255, 214, 150, .10);
    --mat: #3a434d;
    --wall: #2d333a;
    --wall-cap: #0e1114;
    --baseboard: #22272d;
    --carpet: #34424f;
    --carpet-dot: #2f3c48;
    --wood: #5b4733;
    --wood-line: #4c3b2b;
    --table: #6e4f33;
    --table-edge: #4e3824;
    --coffee-table: #3b4048;
    --coffee-edge: #2a2e34;
    --sofa: #3e5468;
    --sofa-seat: #4a6379;
    --chair: #1b2026;
    --chair-seat: #252b32;
    --chair-ink: #c9d1d9;
    --laptop: #8d959e;
    --laptop-logo: #c4cad1;
    --screen: #8fd0ff;
    --screen-off: #2b323a;
    --board: #d7dce1;
    --board-ink: #1d2731;
    --chalk: #233a2f;
    --frame: #5b6570;
    --clock: #d7dce1;
    --glass: rgba(44, 60, 76, .94);
    --glass-ink: #dce6ee;
    --door: #66727e;
    --plate: #e7e2d8;
    --plate-edge: #b9b1a3;
    --lamp: rgba(255, 210, 140, .30);
    --dim: rgba(0, 0, 0, .48);
    --idle: #7f8790;
    --ended: #5f6670;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 18px 16px 40px; }

  /* 상단 */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 14px; }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .brand h1 .live { width: 9px; height: 9px; border-radius: 50%; background: var(--working); box-shadow: 0 0 0 3px color-mix(in srgb, var(--working) 25%, transparent); }
  .brand h1 .live.off { background: var(--idle); box-shadow: none; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.hot { border-color: var(--approval); color: var(--approval); font-weight: 600; }
  .theme-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .viewseg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .viewseg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .viewseg button.on { background: var(--ink); color: var(--panel); font-weight: 700; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w, 320px); gap: 16px; align-items: start; }
  .layout > * { min-width: 0; }
  @media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  /* 화면 배치: 꽉 차게 / 패널 왼쪽·숨김 / 패널 폭 끌어서 조절 */
  body.full .wrap { max-width: none; }
  body.side-left .layout { grid-template-columns: var(--side-w, 320px) minmax(0, 1fr); }
  body.side-left .layout > aside { order: -1; }
  body.side-hide .layout { grid-template-columns: minmax(0, 1fr); }
  body.side-hide .layout > aside { display: none; }
  @media (max-width: 1100px) { body.side-left .layout { grid-template-columns: minmax(0, 1fr); } body.side-left .layout > aside { order: 0; } }
  aside.side { position: relative; }
  .side-grip { position: absolute; top: 0; bottom: 0; left: -12px; width: 10px; cursor: col-resize; border-radius: 6px; z-index: 2; }
  .side-grip:hover, .side-grip.drag { background: color-mix(in srgb, var(--done) 30%, transparent); }
  body.side-left .side-grip { left: auto; right: -12px; }
  @media (max-width: 1100px) { .side-grip { display: none; } }
  .layoutseg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .layoutseg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .layoutseg button.on { background: var(--ink); color: var(--panel); font-weight: 700; }
  @media (max-width: 1100px) { .layoutseg .wide-only { display: none; } }

  /* 평면도 */
  .floorplan {
    display: grid;
    border: 7px solid var(--wall-cap);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background-color: var(--tile);
    background-image:
      linear-gradient(var(--tile-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--tile-line) 1px, transparent 1px);
    background-size: 30px 30px;
    --corr-h: 66px;
  }
  .floorplan.narrow { --corr-h: 54px; }
  .room-cell { position: relative; }
  .room-cell > svg { display: block; width: 100%; height: auto; }
  .room-cell.alert::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px var(--approval);
    animation: alertPulse 1.3s ease-in-out infinite;
  }
  .room-cell text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .corridor {
    position: relative; height: var(--corr-h);
    background-image:
      radial-gradient(ellipse 22% 60% at 18% 50%, var(--pool), transparent 70%),
      radial-gradient(ellipse 22% 60% at 50% 50%, var(--pool), transparent 70%),
      radial-gradient(ellipse 22% 60% at 82% 50%, var(--pool), transparent 70%);
  }
  .corridor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: linear-gradient(rgba(0,0,0,.10), transparent); }
  .corridor .mat { position: absolute; top: 0; height: 10px; background: var(--mat); border-radius: 0 0 4px 4px; transform: translateX(-50%); opacity: .85; }
  .corridor .deco { position: absolute; bottom: 5px; height: calc(var(--corr-h) - 14px); transform: translateX(-50%); display: block; }
  .corridor .deco svg { height: 100%; width: auto; display: block; }
  .corridor .sign { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--muted); white-space: nowrap; opacity: .9; }
  .spine {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 10px 0 12px; gap: 10px;
    border-right: 4px solid var(--wall-cap);
    background-image: radial-gradient(ellipse 80% 14% at 50% 50%, var(--pool), transparent 70%);
  }
  .spine svg { width: 52px; height: auto; display: block; }
  .floor-sign {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; color: var(--ink);
    background: var(--wall); border-top: 6px solid var(--wall-cap); border-bottom: 3px solid var(--wall-cap);
  }
  .floor-sign b { background: var(--ink); color: var(--panel); padding: 2px 10px; border-radius: 6px; }
  .floor-sign span { margin-left: auto; color: var(--muted); font-size: 12px; }
  .exit { background: #1f9d55; color: #fff; font: 700 10px/1 system-ui, sans-serif; padding: 4px 6px; border-radius: 3px; letter-spacing: .06em; box-shadow: 0 0 10px rgba(31, 157, 85, .45); }
  .floor-label { font: 700 11px/1 system-ui, sans-serif; color: var(--muted); writing-mode: vertical-rl; letter-spacing: .2em; }

  /* 회의실 들어가기 (카메라 확대) */
  .stage { position: relative; overflow: hidden; border-radius: 12px; }
  #office { transform-origin: 0 0; transition: transform .62s cubic-bezier(.3, .75, .2, 1); }
  .stage.zoomed #office { visibility: hidden; }
  .room-cell { cursor: zoom-in; outline: none; }
  .room-cell.storage { cursor: default; }
  .room-cell:focus-visible { box-shadow: inset 0 0 0 3px var(--done); }
  .room-view {
    position: absolute; left: 0; top: 0; width: 100%; opacity: 0; transition: opacity .28s ease; z-index: 3;
    border-radius: 12px;
    background-color: var(--tile);
    background-image: linear-gradient(var(--tile-line) 1px, transparent 1px), linear-gradient(90deg, var(--tile-line) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .room-view.show { opacity: 1; }
  .rv-scene { position: relative; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .rv-scene > svg { display: block; width: 100%; height: auto; }
  .room-view svg .bubble { display: none; }
  .rv-back { position: absolute; left: 10px; top: 10px; z-index: 4; border: 0; border-radius: 999px; padding: 6px 12px; background: rgba(20, 24, 30, .74); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .rv-back:hover { background: rgba(20, 24, 30, .9); }
  .rv-door { position: absolute; z-index: 3; cursor: pointer; }
  .rv-door:hover::after { content: "복도로 나가기"; position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%); background: rgba(20, 24, 30, .85); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  /* 회의실 안 말풍선: 건너편 줄은 머리 위로, 이쪽 줄은 의자 아래로. 평소 9줄, 마우스를 올리면 넓어지고 전부(넘치면 스크롤) */
  .rv-scene { container-type: inline-size; }
  .bubbles { position: absolute; inset: 0; pointer-events: none; }
  .sb {
    position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
    background: #fffefb; color: #1f2328; border: 1px solid rgba(0, 0, 0, .08); border-left: 4px solid var(--c, #8f969d);
    border-radius: 10px; padding: .45em .65em .5em; min-width: 9%;
    font-size: clamp(9px, 1.22cqw, 14px); line-height: 1.38; box-shadow: 0 6px 16px rgba(0, 0, 0, .18);
    animation: sbIn .25s ease-out;
  }
  .sb::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); border: 7px solid transparent; border-bottom: 0; border-top-color: #fffefb; }
  .sb.below { transform: translate(-50%, 0); animation-name: sbInBelow; }
  .sb.below::after { bottom: auto; top: -7px; border: 7px solid transparent; border-top: 0; border-bottom-color: #fffefb; }
  .sb b { display: block; font-size: .82em; color: #5b6470; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb p { margin: 0; display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .sb:hover { z-index: 6; max-width: 48% !important; opacity: 1; }
  .sb:hover p { display: block; -webkit-line-clamp: unset; max-height: 17.5cqw; overflow-y: auto; }
  .sb.below:hover p { max-height: 18.5cqw; }
  .sb.alert.below::after { border-bottom-color: #fff3f2; }
  .sb.mini.below::after { border-bottom-color: var(--c); }
  @keyframes sbInBelow { from { opacity: 0; transform: translate(-50%, -8%); } }

  /* 평면도 말풍선: 작게 2줄(가장 최근에 말한 사람은 3줄), 마우스를 올리면 전부 */
  .room-cell { container-type: inline-size; }
  .room-cell:hover { z-index: 5; }
  .pbs { position: absolute; inset: 0; pointer-events: none; }
  .pbub {
    position: absolute; transform: translate(-50%, -100%); pointer-events: auto;
    background: #fffefb; color: #1f2328; border-left: 3px solid var(--c, #8f969d); border-radius: 7px;
    padding: .2em .45em .3em; max-width: var(--mw, 17%); min-width: 9%;
    font-size: clamp(8px, 3.1cqw, 11.5px); line-height: 1.3; box-shadow: 0 3px 8px rgba(0, 0, 0, .22);
  }
  .pbub::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: #fffefb; }
  .pbub p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .pbub.latest { max-width: 38%; z-index: 2; box-shadow: 0 0 0 1.5px var(--c), 0 4px 10px rgba(0, 0, 0, .25); }
  .pbub.latest p { -webkit-line-clamp: 3; }
  .pbub.tool p { color: #5b6470; font-style: italic; }
  .pbub.alert { background: #fff3f2; border-left-color: var(--approval); }
  .pbub.alert::after { border-top-color: #fff3f2; }
  .pbub:hover { z-index: 7; max-width: 62%; }
  .pbub:hover p { display: block; -webkit-line-clamp: unset; max-height: 46cqw; overflow-y: auto; }
  .speech-card {
    position: absolute; left: 50%; top: 4%; transform: translateX(-50%); z-index: 8;
    width: min(64%, 640px); max-height: 84%; display: flex; flex-direction: column;
    background: #fffefb; color: #1f2328; border-radius: 14px; border-top: 5px solid var(--c, #8f969d);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35); overflow: hidden;
  }
  .speech-card header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ece7dc; }
  .speech-card header b { font-size: 15px; }
  .speech-card header span { color: #6b7178; font-size: 12px; }
  .speech-card header button { border: 1px solid #ddd5c6; background: #f6f2ea; border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; color: #1f2328; }
  .speech-card header .sc-more { margin-left: auto; }
  .speech-card ol { list-style: none; margin: 0; padding: 10px 14px 14px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .speech-card li { font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .speech-card li time { display: block; font-size: 11.5px; color: #8a8f96; margin-bottom: 1px; }
  .speech-card li + li { border-top: 1px dashed #e6dfd2; padding-top: 10px; }
  .compact .speech-card { width: 92%; }
  .sb.tool p { color: #5b6470; font-style: italic; }
  .sb.alert { background: #fff3f2; border-left-color: var(--approval); }
  .sb.alert::after { border-top-color: #fff3f2; }
  .sb.latest { box-shadow: 0 0 0 2px var(--c), 0 8px 20px rgba(0, 0, 0, .22); z-index: 2; }
  .sb.old { opacity: .8; }
  .sb.mini { min-width: 0; padding: 1px 9px 2px; border: 0; border-radius: 999px; font-weight: 800; color: #fff; background: var(--c); }
  .sb.mini::after { border-top-color: var(--c); }
  .compact .sb p { -webkit-line-clamp: 4; }
  @keyframes sbIn { from { opacity: 0; transform: translate(-50%, -90%); } }
  @media (prefers-reduced-motion: reduce) { #office { transition: none; } .room-view { transition: none; } .sb { animation: none; } }

  /* 회의록 */
  .minutes .min-sub { margin: 0; padding: 6px 12px 0; color: var(--muted); font-size: 12px; }
  .min-tools { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .min-tools .save { margin-left: auto; border: 0; background: var(--done); color: #fff; border-radius: 8px; padding: 5px 10px; font-weight: 700; cursor: pointer; font-size: 12.5px; }
  .min-list { list-style: none; margin: 0; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; max-height: min(72vh, 780px); overflow: auto; }
  .m-say { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: 10px; padding: 7px 9px; }
  .m-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
  .m-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c, var(--idle)); }
  .m-head b { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-head em { flex: none; font-style: normal; font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--line); color: var(--ink); }
  .m-head time { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
  .m-text { margin-top: 3px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m-text.clamp { max-height: 9em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 65%, transparent); mask-image: linear-gradient(#000 65%, transparent); }
  .m-more { border: 0; background: none; color: var(--done); font-size: 12px; padding: 2px 0 0; cursor: pointer; }
  .m-meet { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink); padding: 4px 0; }
  .m-meet::before, .m-meet::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .m-state { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .m-tool { font: 11.5px ui-monospace, Consolas, monospace; color: var(--muted); padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 사람 */
  .person { cursor: pointer; outline: none; }
  .person:hover, .person:focus-visible { filter: brightness(1.08) drop-shadow(0 0 2px rgba(255,255,255,.6)); }
  .plate-card { cursor: pointer; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
  .typing .hand-l { animation: tap .5s ease-in-out infinite; }
  .typing .hand-r { animation: tap .5s ease-in-out .25s infinite; }
  .bubble { transform-box: fill-box; transform-origin: 30% 100%; }
  .b-approval, .b-question { animation: pop 1.1s ease-in-out infinite; }
  .tdot { animation: fade 1.2s infinite; }
  .tdot.d2 { animation-delay: .2s; }
  .tdot.d3 { animation-delay: .4s; }
  .led-blink { animation: fade 1s steps(2) infinite; }
  .steam { animation: steam 2.4s ease-in-out infinite; }
  .screen-glow { animation: flicker 3s ease-in-out infinite; }
  .quiet { opacity: .55; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes tap { 50% { transform: translateY(-1.2px); } }
  @keyframes pop { 50% { transform: scale(1.14); } }
  @keyframes fade { 50% { opacity: .2; } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-4px); } }
  @keyframes flicker { 50% { opacity: .75; } }
  @keyframes alertPulse { 50% { box-shadow: inset 0 0 0 3px transparent; } }
  @media (prefers-reduced-motion: reduce) {
    .eyes, .typing .hand-l, .typing .hand-r, .b-approval, .b-question, .tdot, .led-blink, .steam, .screen-glow, .room-cell.alert::after { animation: none !important; }
  }

  /* 오른쪽 */
  .side { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card h2 { margin: 0; padding: 10px 12px 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .card h2 .n { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 12px; }
  .list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .item { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-left-width: 4px; background: var(--panel-2); border-radius: 8px; padding: 7px 9px; cursor: pointer; }
  .item:hover { border-color: var(--muted); }
  .item .row1 { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .item .row1 .room-name { font-weight: 700; color: var(--ink); }
  .item .row1 .ago { margin-left: auto; font-variant-numeric: tabular-nums; }
  .item .row2 { font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .row3 { color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pill { flex: none; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; }
  .empty-note { color: var(--muted); font-size: 12.5px; padding: 12px; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 10px 12px 4px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .hint { margin: 0; padding: 4px 12px 10px; font-size: 12px; color: var(--muted); }

  .banner { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; color: var(--muted); }
  .banner b { color: var(--ink); }
  .foot { margin-top: 18px; color: var(--muted); font-size: 12px; }
  .foot code { font-family: ui-monospace, Consolas, monospace; background: var(--panel); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }

  /* 상세 */
  .scrim { position: fixed; inset: 0; background: rgba(12, 14, 18, .5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .scrim.open { display: flex; }
  .sheet { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .sheet header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheet header h3 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .sheet .close { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .sheet dl { margin: 0; padding: 12px 16px 6px; display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; }
  .sheet dt { color: var(--muted); font-size: 12.5px; }
  .sheet dd { margin: 0; overflow-wrap: anywhere; }
  .sheet .actions { display: flex; gap: 8px; padding: 10px 16px 16px; align-items: center; flex-wrap: wrap; }
  .sheet .actions input { flex: 1; min-width: 200px; font: 12.5px ui-monospace, Consolas, monospace; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); }
  .sheet .actions button { border: 0; background: var(--ink); color: var(--panel); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; }

  /* 3D 사무실 (office3d.js) */
  .office3d { position: relative; height: clamp(420px, calc(100vh - 150px), 1600px); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: var(--tile); touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .office3d { height: 64vh; } }
  .office3d canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  .office3d canvas:active { cursor: grabbing; }
  .o3-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); }
  .o3-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .o3-layer > * { position: absolute; left: 0; top: 0; will-change: transform; }
  /* 방 글자 이름표: 유리 명패가 너무 작게 보이거나 뒷면이 보일 때 그 자리에 뜬다. 명패와 같은 모양 (왼쪽 띠 = 방 상태 색) */
  .o3-room { pointer-events: auto; cursor: pointer; display: inline-flex; align-items: baseline; gap: 5px; border: 0; border-left: 4px solid var(--rc, #8f969d); padding: 2px 8px 3px 6px; border-radius: 4px; background: rgba(255, 255, 255, .95); color: #1f2328; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
  .o3-room em { font-style: normal; color: #8a929c; }
  .o3-room.alert { box-shadow: 0 0 0 2px var(--approval), 0 1px 4px rgba(0, 0, 0, .2); animation: o3pulse 1.3s ease-in-out infinite; }
  .o3-room.dim { opacity: .5; }
  .o3-room.static { pointer-events: none; cursor: default; }
  .o3-room.compact { padding: 1px 6px 2px 5px; font-size: 11px; }
  .o3-zone { z-index: 30; font-size: 15px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--zc, var(--line)); padding: 5px 12px 5px 10px; border-radius: 8px; box-shadow: var(--shadow); white-space: nowrap; }
  .o3-zone b { font-weight: 800; }
  .o3-zone span { margin-left: 8px; color: var(--muted); font-size: 12px; }
  .o3-spot { font-size: 11px; font-weight: 700; color: #fff; background: rgba(20, 24, 30, .6); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  /* 사람 이름표: 머리 오른쪽 옆 네모. 줄 나눔·말줄임은 office3d.js 가 폭에 맞춰 미리 한다 (TAG_FONT·TAG_PAD 와 맞출 것) */
  .o3-tag { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 3px; padding: 2px 3px; border-left: 3px solid var(--sc); border-radius: 3px; background: rgba(255, 255, 255, .95); color: #1f2328; font-size: 9px; line-height: 1.2; font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .22); z-index: 5; }
  .o3-tag span { white-space: nowrap; }
  .o3-tag .ico { flex: none; display: grid; place-items: center; width: 12px; height: 12px; border-radius: 2px; background: var(--sc); color: #fff; font-size: 9px; font-weight: 900; line-height: 1; }
  .o3-tag.icon-only { padding: 0; border-left: 0; background: none; box-shadow: none; }
  .o3-tag.icon-only span { display: none; }
  .o3-tag.icon-only .ico { width: 20px; height: 20px; border-radius: 50%; font-size: 13px; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); animation: o3bob 1.1s ease-in-out infinite; }
  .o3-bub { pointer-events: auto; cursor: pointer; background: #fffefb; color: #1f2328; border-left: 3px solid var(--c, #8f969d); border-radius: 8px; padding: .25em .5em .3em; min-width: 60px; max-width: var(--mw, 180px); font-size: 11.5px; line-height: 1.35; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); }
  .o3-bub::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; border-top-color: #fffefb; }
  .o3-bub.below::after { bottom: auto; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #fffefb; }
  .o3-bub b { display: none; }
  .o3-bub p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .o3-bub.latest { box-shadow: 0 0 0 1.5px var(--c), 0 4px 12px rgba(0, 0, 0, .25); }
  .o3-bub.latest p { -webkit-line-clamp: 3; }
  .o3-bub.big { font-size: 13px; padding: .4em .65em .45em; border-left-width: 4px; }
  .o3-bub.big b { display: block; font-size: .82em; color: #5b6470; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o3-bub.big p { -webkit-line-clamp: 9; }
  .o3-bub.tool p { color: #5b6470; font-style: italic; }
  .o3-bub.alert { background: #fff3f2; border-left-color: var(--approval); }
  .o3-bub.alert::after { border-top-color: #fff3f2; }
  .o3-bub.alert.below::after { border-top-color: transparent; border-bottom-color: #fff3f2; }
  .o3-bub:hover { z-index: 40 !important; max-width: min(460px, 70vw); }
  .o3-bub:hover p { display: block; -webkit-line-clamp: unset; max-height: 50vh; overflow-y: auto; }
  .o3-tools { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: rgba(20, 24, 30, .74); }
  .o3-tools button { border: 0; background: transparent; color: #fff; min-width: 32px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .o3-tools button:hover { background: rgba(255, 255, 255, .15); }
  .o3-tools .wide { padding: 0 10px; font-size: 12.5px; font-weight: 700; }
  .o3-hint { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 24px); padding: 3px 10px; border-radius: 8px; background: rgba(20, 24, 30, .6); color: #fff; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .8s; }
  .o3-hint.fade { opacity: 0; }
  .o3-back { z-index: 6; }
  .o3-look { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 7; display: grid; gap: 8px; min-width: min(320px, calc(100% - 24px)); padding: 10px 12px; border-radius: 12px; background: rgba(20, 24, 30, .88); color: #fff; font-size: 12.5px; }
  .o3-look-row { display: flex; align-items: center; gap: 10px; }
  .o3-look-row > span { flex: none; width: 44px; color: #c9d1d9; font-weight: 700; }
  .o3-look-row input[type=range] { flex: 1; min-width: 0; }
  .o3-look-row em { font-style: normal; font-size: 11px; color: #9aa4ae; white-space: nowrap; }
  .o3-themes { display: flex; flex-wrap: wrap; gap: 4px; }
  .o3-themes button { border: 1px solid rgba(255, 255, 255, .28); background: transparent; color: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .o3-themes button.on { background: #fff; color: #1f2328; font-weight: 700; }
  .o3-ceo-btn { border: 1px solid rgba(255, 255, 255, .28); background: transparent; color: #fff; border-radius: 8px; width: 28px; height: 26px; cursor: pointer; }
  .o3-ceo-name { flex: 1; min-width: 0; text-align: center; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o3-tag.sel { box-shadow: 0 0 0 2px #f2c14e, 0 1px 4px rgba(0, 0, 0, .22); }
  .office3d .speech-card { z-index: 8; }
  @keyframes o3pulse { 50% { box-shadow: 0 0 0 2px transparent, 0 2px 8px rgba(0, 0, 0, .18); } }
  @keyframes o3bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .o3-room.alert, .o3-tag.icon-only .ico { animation: none; } }

<body>
<!-- 모든 방이 같이 쓰는 무늬와 그라디언트 -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <pattern id="carpet" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="var(--carpet)"/>
      <circle cx="5" cy="5" r="0.9" fill="var(--carpet-dot)"/>
    </pattern>
    <pattern id="wood" width="56" height="14" patternUnits="userSpaceOnUse">
      <rect width="56" height="14" fill="var(--wood)"/>
      <rect y="13" width="56" height="1" fill="var(--wood-line)"/>
      <rect x="31" width="1" height="13" fill="var(--wood-line)"/>
    </pattern>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="var(--lamp)"/>
      <stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fcbf2"/><stop offset="1" stop-color="#dff1fb"/></linearGradient>
    <linearGradient id="sky-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f6fb0"/><stop offset=".55" stop-color="#f39a6b"/><stop offset="1" stop-color="#fbd49b"/></linearGradient>
    <linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1834"/><stop offset="1" stop-color="#28406e"/></linearGradient>
  </defs>
</svg>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1><span class="live off" id="live"></span>업무방 현황판</h1>
      <p id="sub">기록을 불러오는 중…</p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="viewseg" id="dimSeg" role="group" aria-label="평면도/3D">
      <button type="button" data-dim="2d" title="평면도">2D</button><button type="button" data-dim="3d" title="사람이 실제 상태대로 걸어 다니는 3D 사무실">3D</button>
    </div>
    <div class="viewseg" id="viewSeg" role="group" aria-label="보기 크기">
      <button type="button" data-view="auto" title="화면 폭에 맞춰서">자동</button><button type="button" data-view="one" title="한 줄에 방 1개씩 크게">크게</button><button type="button" data-view="all" title="한 줄에 방 3개씩 줄여서 한눈에">작게</button>
    </div>
    <div class="layoutseg" id="layoutSeg" role="group" aria-label="화면 배치">
      <button type="button" data-lay="full" class="wide-only" title="화면 폭을 끝까지 쓰기">꽉 차게</button><button type="button" data-lay="side" class="wide-only" title="오른쪽 패널을 왼쪽으로 옮기기">패널 ⇄</button><button type="button" data-lay="hide" title="오른쪽 패널 숨기기/보이기">패널 숨김</button>
    </div>

  </div>
  <div id="banner"></div>
  <div class="layout">
    <main class="stage" id="stage" aria-label="사무실 평면도">
      <div id="office"></div>
      <div class="office3d" id="office3d" hidden></div>
      <div class="room-view" id="roomView" hidden></div>
    </main>
    <aside class="side">
      <div class="side-grip" id="sideGrip" title="끌어서 패널 폭 바꾸기" role="separator" aria-orientation="vertical"></div>

        <section class="card">
          <h2>확인할 일 <span class="n" id="todoN"></span></h2>
          <ul class="list" id="todo"></ul>
        </section>

          <h2>일하는 중 <span class="n" id="busyN"></span></h2>

<script>
(function () {
  'use strict';

  var STATE = {
    working:  { label: '일하는 중', color: 'var(--working)', rank: 3 },
    approval: { label: '승인 대기', color: 'var(--approval)', rank: 0 },
    question: { label: '답변 대기', color: 'var(--question)', rank: 0 },
    error:    { label: '막힘',     color: 'var(--error)', rank: 1 },
    done:     { label: '내 차례',   color: 'var(--done)', rank: 2 },
    idle:     { label: '대기',     color: 'var(--idle)', rank: 4 },
    ended:    { label: '종료',     color: 'var(--ended)', rank: 5 }
  };

  // 회의 상태 파일(meetings/*.json)의 역할 상태 → 화면 상태
  var ROLE_STATE = { waiting: 'idle', working: 'working', done: 'done', error: 'error', idle: 'idle' };
  function roundLabel(r) {
    return { r1: '1라운드', r2: '2라운드', r3: '3라운드', synthesis: '종합', critic: '비평', wrapup: '정리' }[r] || r || '';
  }
  // "2라운드 · 2라운드 반론 작성 중" 처럼 겹치지 않게 라운드와 진행 상황을 합친다.
  function roundPhase(m) {
    var round = roundLabel(m.round);
    if (m.phase && round && m.phase.indexOf(round) >= 0) return m.phase;
    return [round, m.phase].filter(Boolean).join(' · ');
  }
  // 회의실 안 화면에서 방 그림의 폭: 화면 높이에 맞춘다 (방 그림 비율 280:236).
  function roomViewWidth(stageWidth) {
    return Math.min(stageWidth, Math.max(320, (window.innerHeight - 110) * 400 / 346));

  function renderOffice(now, meetings) {
    var k = columns();
    var spine = k >= 2 && (office.clientWidth || window.innerWidth) >= 640;
    var sessions = data.sessions || [];
    var hour = new Date(now).getHours();
    var key = JSON.stringify([k, hour, data.rooms, data.meetings || [], selfName(), (data.machines || []).map(function (m) { return [m.name, Math.floor((now - m.generatedAt) / 60000)]; }), sessions.map(function (s) {

    })]);

  function render() {

        var r = STATE[a.state].rank - STATE[b.state].rank;
        if (r) return r;
        return a.state === 'done' ? b.stateSince - a.stateSince : a.stateSince - b.stateSince;
      });
    var todoCount = todo.length + meetingWaits.length;
    document.getElementById('todoN').textContent = todoCount ? todoCount + '건' : '';
    document.getElementById('todo').innerHTML = todoCount ? meetingWaits.map(meetingItemHtml).join('') + todo.map(itemHtml).join('') :
      '<li class="empty-note">지금은 확인할 일이 없어요.</li>';
    var busy = sessions.filter(function (s) { return s.state === 'working'; }).sort(function (a, b) { return a.stateSince - b.stateSince; });
    document.getElementById('busyN').textContent = busy.length ? busy.length + '개' : '';
    document.getElementById('busy').innerHTML = busy.length ? busy.map(itemHtml).join('') : '<li class="empty-note">일하는 AI가 없어요.</li>';

    if (openId) fillSheet(openId);
  }

  // ---------- 회의실 안으로 들어가기 ----------
  // 한 메시지가 여러 조각으로 기록되므로 같은 메시지끼리 이어 붙인다 (t2 = 마지막 조각 시각).
  function mergeSayJs(entries) {
    var out = [], byMsg = {};
    entries.forEach(function (e) {
      if (e.kind === 'say' && e.mid) {
        var k = e.sid + '|' + e.mid;
        var it = byMsg[k];
        if (!it) { it = Object.assign({}, e, { parts: [], t2: e.t }); byMsg[k] = it; out.push(it); }
        it.parts.push([e.idx || 0, e.text || '']);
        if (e.t > it.t2) it.t2 = e.t;
        return;
      }
      out.push(e);
    });
    Object.keys(byMsg).forEach(function (k) {
      var it = byMsg[k];
      it.text = it.parts.sort(function (a, b) { return a[0] - b[0]; }).map(function (p) { return p[1]; }).join('');
      delete it.parts;
    });
    return out;
  }
  function personColor(seed) { return look(String(seed || '')).shirt; }
  function liveName(sid, fallback) {
    if (sid && roleOf[sid]) return roleOf[sid];
    var s = sid && byId[sid];
    if (s && !s.synthetic && s.title) return fit(s.title, 14);
    return fallback || '?';
  }
  function plain(t, max) {
    var s = String(t || '').replace(/```[\s\S]*?```/g, ' ').replace(/[*_`#>|]+/g, '').replace(/\s+/g, ' ').trim();
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }
  function hm(t) {
    var d = new Date(t);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  var KIND_KO = { order: '지시', report: '보고', msg: '메시지', ask: '요청', dispatch: '투입' };
  function speakerOf(e, mt) {
    if (e.kind === 'order') return { who: e.who || '의장', to: liveName(e.sid, e.to), color: mt && mt.chairId ? personColor(mt.chairId) : 'var(--question)' };
    if (e.kind === 'ask') return { who: '사용자', to: liveName(e.sid, e.to), color: 'var(--ink)' };
    if (e.kind === 'msg') return { who: e.who || '다른 세션', to: liveName(e.sid, e.to), color: 'var(--idle)' };
    return { who: liveName(e.sid, e.who), to: e.to || '', color: personColor(e.sid || e.who) };
  }
  function roomMeeting(name) { return currentMeetings.filter(function (m) { return m.room === name; })[0] || null; }

  function speechBySid(entries) {
    var out = {};
    mergeSayJs(entries).forEach(function (e) {
      if (!e.sid) return;
      var o = out[e.sid] || (out[e.sid] = {});
      var t = e.t2 || e.t;
      if (e.kind === 'say' || e.kind === 'report' || e.kind === 'dispatch') { if (!o.say || t >= (o.say.t2 || o.say.t)) o.say = e; }
      else if (e.kind === 'tool') { if (!o.tool || t >= o.tool.t) o.tool = e; }
    });
    return out;
  }

  function bubbleFor(s, sp, now) {
    sp = sp || {};
    if (s.state === 'approval') return { kind: 'alert', text: '승인 기다리는 중' + (s.waitingFor ? ' · ' + s.waitingFor : '') };
    if (s.state === 'question') return { kind: 'alert', text: '답변 기다리는 중' + (s.waitingFor ? ' · ' + s.waitingFor : '') };
    if (s.state === 'error') return { kind: 'alert', text: s.errorText || 'API 오류로 멈췄어요' };
    if (sp.say && now - (sp.say.t2 || sp.say.t) < 20 * 60000) return { kind: 'say', text: plain(sp.say.text, 2000), t: sp.say.t2 || sp.say.t };
    if (s.state === 'working' && sp.tool && now - sp.tool.t < 3 * 60000) return { kind: 'tool', text: sp.tool.text };
    return { kind: 'mini', text: { working: '…', done: '✓', idle: 'z' }[s.state] || '·' };
  }

  // 사람마다 말풍선 내용을 정한다. 회의실 안은 그 방 회의록에서, 평면도는 speech.js 에서 최근 말을 가져온다.
  function speechInfo() {
    var info = {};
    var live = (speechData && speechData.bySid) || {};
    Object.keys(live).forEach(function (k) { info[k] = live[k]; });
    if (logData && zoomRoom) {
      var fromLog = speechBySid(logData.entries || []);
      Object.keys(fromLog).forEach(function (k) {
        var a = info[k] || {}, b = fromLog[k];
        info[k] = {
          say: !a.say || (b.say && (b.say.t2 || b.say.t) >= a.say.t) ? b.say || a.say : a.say,
          tool: !a.tool || (b.tool && b.tool.t >= a.tool.t) ? b.tool || a.tool : a.tool
        };
      });
    }
    return info;
  }

  function renderBubbles(room, list, mt, now) {
    var el = document.getElementById('bubbles');
    if (!el || !roomGeo) return;
    var info = speechInfo();
    var html = withGeo(roomGeo, function () {
      var L = layoutRoom(list, room.kind, mt);
      var k = SEAT_X.length;
      var maxW = n(100 / k - 2.5);
      var seats = [];
      L.far.forEach(function (e, i) { if (e) seats.push({ s: e.s, label: e.label, x: SEAT_X[i], y: FAR_HY - 12, row: '' }); });
      L.near.forEach(function (p, i) { if (p && !p.worker) seats.push({ s: p.s, label: p.label, x: SEAT_X[i], y: NEAR_BOT + 3, row: ' below' }); });
      var items = seats.map(function (seat) { return Object.assign(seat, bubbleFor(seat.s, info[seat.s.id], now)); });
      var latest = 0;
      items.forEach(function (it) { if (it.kind === 'say' && it.t > latest) latest = it.t; });
      return items.map(function (it) {
        var name = esc(it.label || fit(titleOf(it.s), 8));
        var pos = 'left:' + n(it.x / W * 100) + '%;top:' + n(it.y / H * 100) + '%;--c:' + personColor(it.s.id);
        if (it.kind === 'mini') return '<div class="sb mini' + it.row + '" data-id="' + esc(it.s.id) + '" style="' + pos + '" title="' + name + '">' + it.text + '</div>';
        var cls = 'sb ' + it.kind + it.row + (it.kind === 'say' && it.t === latest ? ' latest' : '') + (it.kind === 'say' && now - it.t > 5 * 60000 ? ' old' : '');
        return '<div class="' + cls + '" data-id="' + esc(it.s.id) + '" style="' + pos + ';max-width:' + maxW + '%"><b>' + name + '</b><p>' + esc(it.text) + '</p></div>';
      }).join('');
    });
    if (html !== lastBubbleKey) {
      lastBubbleKey = html;
      el.innerHTML = html;
    }
    renderSpeechCard();
  }

  // 말풍선을 누르면 그 사람이 최근에 한 말을 잘리지 않게 크게 보여 준다.
  var cardSid = null, lastCardKey = '', roomGeo = null;
  function renderSpeechCard() {
    var box = document.getElementById('speechCard');
    if (!box) return;
    if (!cardSid || !logData) { box.hidden = true; lastCardKey = ''; return; }
    var said = mergeSayJs(logData.entries || []).filter(function (e) {
      return e.sid === cardSid && (e.kind === 'say' || e.kind === 'report' || e.kind === 'dispatch');
    }).slice(-6);
    var s = byId[cardSid];
    var name = liveName(cardSid, s ? titleOf(s) : '');
    var key = cardSid + '|' + said.map(function (e) { return (e.t2 || e.t) + ':' + (e.text || '').length; }).join(',');
    box.hidden = false;
    if (key === lastCardKey) return;
    lastCardKey = key;
    box.style.setProperty('--c', personColor(cardSid));
    box.innerHTML = '<header><b>' + esc(name) + '</b><span>최근에 한 말</span>' +
      '<button type="button" class="sc-more" data-id="' + esc(cardSid) + '">세션 정보</button><button type="button" class="sc-close" aria-label="닫기">✕</button></header>' +
      '<ol>' + (said.length ? said.map(function (e) {
        var label = KIND_KO[e.kind] ? ' · ' + KIND_KO[e.kind] : '';
        return '<li><time>' + hm(e.t2 || e.t) + label + '</time>' + esc(String(e.text || '').replace(/\*\*/g, '').trim()) + '</li>';
      }).join('') : '<li>아직 기록된 말이 없어요.</li>') + '</ol>';
    var ol = box.querySelector('ol');
    ol.scrollTop = ol.scrollHeight;
  }

  function renderRoomView(now) {
    if (dim === '3d') { render3d(now); return; }
    if (!zoomRoom || !data) return;
    var room = roomsView().filter(function (r) { return r.name === zoomRoom; })[0];
    if (!room) { exitRoom(); return; }
    var list = (data.sessions || []).filter(function (s) { return s.room === room.name; });
    var mt = roomMeeting(room.name);
    var key = JSON.stringify([room.name, new Date(now).getHours(), (data.meetings || []).filter(function (m) { return m.room === room.name; }),
      list.map(function (s) { return [s.id, s.state, s.title, s.quiet, (s.subagents || []).map(function (a) { return a.type; })]; })]);
    if (key !== lastRoomScene) {
      lastRoomScene = key;
      // 회의실 안도 평면도와 같은 한 줄 자리 수(4~6, 최대 12명)를 쓴다.
      roomGeo = interiorGeo(seatsPerRow(list, room.kind, mt));
      var scene = withGeo(roomGeo, function () {
        return roomSvg(room, list, room.kind, now, mt) +
          '<div class="rv-door" role="button" aria-label="복도로 나가기" style="left:' + n(DOOR_L / W * 100) + '%;width:' + n((DOOR_R - DOOR_L) / W * 100) + '%;top:' + n((FRONT - 46) / H * 100) + '%;bottom:0"></div>';
      });
      roomView.innerHTML = '<div class="rv-scene" style="width:' + n(roomViewWidth(stage.clientWidth)) + 'px">' + scene +
        '<div class="bubbles" id="bubbles"></div>' +
        '<div class="speech-card" id="speechCard" role="dialog" aria-label="최근에 한 말" hidden></div>' +
        '<button type="button" class="rv-back" id="rvBack">← 복도로</button></div>';
      lastBubbleKey = '';
      if (!roomView.hidden) stage.style.height = roomView.offsetHeight + 'px';
    }
    roomView.classList.toggle('compact', roomViewWidth(stage.clientWidth) < 640);
    renderBubbles(room, list, mt, now);
  }

  function enterRoom(name) {
    if (zoomRoom || !data) return;
    if (dim === '3d') {
      // 3D 에서는 카메라가 그 방으로 날아가고, 오른쪽에 회의록이 나온다.
      if (!roomsView().some(function (r) { return r.name === name; })) return;
      zoomRoom = name; logData = null; lastMinKey = ''; expanded = {}; cardSid = null;
      try { history.replaceState(null, '', '#room=' + encodeURIComponent(name)); } catch (_) {}
      renderSide();
      loadRoomLog();
      render3d(Date.now());
      return;
    }
    var cell = office.querySelector('.room-cell[data-room="' + CSS.escape(name) + '"]');
    if (!cell) return;
    zoomRoom = name; logData = null; lastRoomScene = ''; lastBubbleKey = ''; lastMinKey = ''; expanded = {};
    try { history.replaceState(null, '', '#room=' + encodeURIComponent(name)); } catch (_) {}
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var st = stage.getBoundingClientRect(), r = cell.getBoundingClientRect();
    var tw = roomViewWidth(st.width), tl = (st.width - tw) / 2;
    var s = tw / r.width;
    stage.style.height = stage.offsetHeight + 'px';
    office.style.transform = 'translate(' + n(tl - (r.left - st.left) * s) + 'px,' + n(-(r.top - st.top) * s) + 'px) scale(' + n(s * 1000) / 1000 + ')';
    renderRoomView(Date.now());
    renderSide();
    loadRoomLog();
    setTimeout(function () {
      if (zoomRoom !== name) return;
      roomView.hidden = false;
      stage.style.height = roomView.offsetHeight + 'px';
      requestAnimationFrame(function () { roomView.classList.add('show'); });
      setTimeout(function () { if (zoomRoom === name) stage.classList.add('zoomed'); }, reduce ? 0 : 300);
      var back = document.getElementById('rvBack');
      if (back) back.focus({ preventScroll: true });
    }, reduce ? 0 : 580);
  }

  function exitRoom() {
    if (!zoomRoom) return;
    if (dim === '3d') { leaveRoomNow(); renderSpeechCard(); render3d(Date.now()); return; }
    var name = zoomRoom;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    zoomRoom = null; logData = null; cardSid = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    stage.classList.remove('zoomed');
    roomView.classList.remove('show');
    stage.style.height = office.offsetHeight + 'px';
    renderSide();
    setTimeout(function () {
      office.style.transform = '';
      setTimeout(function () {
        if (zoomRoom) return;
        roomView.hidden = true;
        roomView.innerHTML = '';
        stage.style.height = '';
        var cell = office.querySelector('.room-cell[data-room="' + CSS.escape(name) + '"]');
        if (cell) cell.focus({ preventScroll: true });
      }, reduce ? 0 : 660);
    }, reduce ? 0 : 220);
  }

  function loadRoomLog() {
    var room = roomsView().filter(function (r) { return r.name === zoomRoom; })[0];
    if (!room || !room.key) return;
    var want = zoomRoom, key = room.key;
    var el = document.createElement('script');
    el.src = 'logs/' + key + '.js?t=' + Date.now();
    el.onload = function () {
      el.remove();
      if (zoomRoom !== want) return;
      logData = (window.__WORKROOM_LOG__ || {})[key] || { room: want, entries: [], missing: true };
      renderRoomView(Date.now());
      renderMinutes();
    };
    el.onerror = function () {
      el.remove();
      if (zoomRoom !== want) return;
      logData = { room: want, entries: [], missing: true };
      renderRoomView(Date.now());
      renderMinutes();
    };
    document.head.appendChild(el);
  }

  // ---------- 회의록 ----------
  function renderSide() {
    document.getElementById('sideDefault').hidden = !!zoomRoom;
    document.getElementById('sideRoom').hidden = !zoomRoom;
    if (!zoomRoom) return;
    document.getElementById('minRoom').textContent = zoomRoom;
    var mt = roomMeeting(zoomRoom);
    document.getElementById('minSub').textContent = mt
      ? '안건 ' + mt.agenda + ' · ' + roundPhase(mt) + (mt.waitingForUser ? ' · 의장 의견 대기' : '')
      : '';
    renderMinutes();
  }

  function entryKey(e) { return e.t + '|' + e.sid + '|' + (e.mid || e.kind); }

  function minuteHtml(e, mt) {
    var time = hm(e.t2 || e.t);
    if (e.kind === 'meeting') return '<li class="m-meet">' + esc(e.text) + ' · ' + time + '</li>';
    if (e.kind === 'state') return '<li class="m-state">' + time + ' · <b>' + esc(liveName(e.sid, e.who)) + '</b> ' + esc(e.text) + '</li>';
    if (e.kind === 'tool') return '<li class="m-tool" title="' + esc(e.text) + '">' + time + ' ' + esc(liveName(e.sid, e.who)) + ' · ' + esc(e.text) + '</li>';
    var sp = speakerOf(e, mt);
    var k = entryKey(e);
    var text = String(e.text || '').trim();
    var long = text.length > 280 || text.split('\n').length > 6;
    var open = !!expanded[k];
    return '<li class="m-say k-' + e.kind + '" style="--c:' + sp.color + '"><div class="m-head"><i class="dot"></i><b>' + esc(sp.who) + (sp.to ? ' → ' + esc(sp.to) : '') + '</b>' +
      (KIND_KO[e.kind] ? '<em>' + KIND_KO[e.kind] + '</em>' : '') + '<time>' + time + '</time></div>' +
      '<div class="m-text' + (long && !open ? ' clamp' : '') + '">' + esc(text) + '</div>' +
      (long ? '<button type="button" class="m-more" data-k="' + esc(k) + '">' + (open ? '접기' : '더 보기') + '</button>' : '') + '</li>';
  }

  function renderMinutes(force) {
    if (!zoomRoom) return;
    var list = document.getElementById('minList');
    if (!logData) { list.innerHTML = '<li class="empty-note">회의록을 불러오는 중…</li>'; lastMinKey = ''; return; }
    var items = mergeSayJs(logData.entries || []).filter(function (e) { return minFilter === 'all' || e.kind !== 'tool'; });
    var key = minFilter + '|' + (logData.generatedAt || 0) + '|' + items.length + '|' + Object.keys(expanded).join(',') + '|' + JSON.stringify(roleOf);
    if (!force && key === lastMinKey) return;
    var atBottom = !lastMinKey || list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    lastMinKey = key;
    var mt = roomMeeting(zoomRoom);
    list.innerHTML = items.length ? items.map(function (e) { return minuteHtml(e, mt); }).join('')
      : '<li class="empty-note">' + (logData.missing ? '아직 이 방의 회의록이 없어요. 세션이 말을 하면 여기에 쌓여요.' : '표시할 기록이 없어요.') + '</li>';
    if (atBottom) list.scrollTop = list.scrollHeight;
    document.getElementById('minPath').textContent = logData.mdPath ? '자동 저장: ' + logData.mdPath : '';
  }

  function saveMinutes() {
    if (!logData || !zoomRoom) return;
    var mt = roomMeeting(zoomRoom);
    var items = mergeSayJs(logData.entries || []).filter(function (e) { return e.kind !== 'tool'; });
    var day = logData.day || new Date().toISOString().slice(0, 10);
    var lines = ['# 회의록 · ' + zoomRoom + ' · ' + day, ''];
    if (mt) lines.push('- 안건: ' + mt.agenda, '- 진행: ' + roundPhase(mt), '');
    items.forEach(function (e) {
      var time = hm(e.t);
      if (e.kind === 'meeting') { lines.push('', '### ' + time + ' · ' + e.text, ''); return; }
      var sp = e.kind === 'state' ? { who: liveName(e.sid, e.who), to: '' } : speakerOf(e, mt);
      var label = KIND_KO[e.kind] || (e.kind === 'state' ? '상태' : '');
      lines.push('- ' + time + ' **' + sp.who + (sp.to ? ' → ' + sp.to : '') + '**' + (label ? ' _(' + label + ')_' : '') + ': ' + String(e.text || '').trim().replace(/\n/g, '\n  '));
    });
    var blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '회의록-' + zoomRoom.replace(/[\\/:*?"<>|]/g, '_') + '-' + day + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    var btn = document.getElementById('saveMin');
    btn.textContent = '저장했어요';
    setTimeout(function () { btn.textContent = '회의록 저장'; }, 1600);
  }

  function meetingItemHtml(m) {
    var now = Date.now();
    return '<li><button type="button" class="item"' + (m.chairId ? ' data-id="' + esc(m.chairId) + '"' : '') + ' style="border-left-color:var(--question)">' +
      '<div class="row1"><span class="pill" style="background:var(--question)">의견 대기</span><span class="room-name">' + esc(m.room) + '</span><span>회의</span>' +
      '<span class="ago">' + ago(m.updatedAt, now) + ' 전</span></div>' +
      '<div class="row2">안건 ' + esc(m.agenda) + '</div>' +
      '<div class="row3">' + esc(m.waitingReason || roundPhase(m)) + '</div></button></li>';
  }

  function itemHtml(s) {
    var st = STATE[s.state] || STATE.idle;
    var now = Date.now();
    var subs = (s.subagents || []).length;
    return '<li><button type="button" class="item" data-id="' + esc(s.id) + '" style="border-left-color:' + st.color + '">' +
      '<div class="row1"><span class="pill" style="background:' + st.color + '">' + st.label + '</span><span class="room-name">' + esc(s.room) + '</span>' +
      (roleOf[s.id] ? '<span>' + esc(roleOf[s.id]) + '</span>' : '') +
      (s.app === 'chat' ? '<span>채팅</span>' : '') + (subs ? '<span>워커 ' + subs + '</span>' : '') + '<span class="ago">' + ago(s.stateSince, now) + ' 전</span></div>' +
      '<div class="row2">' + esc(titleOf(s)) + '</div>' +
      (detailLine(s) ? '<div class="row3">' + esc(detailLine(s)) + '</div>' : '') + '</button></li>';
  }

  function fillSheet(id) {
    var s = byId[id];
    if (!s) { closeSheet(); return; }
    var st = STATE[s.state] || STATE.idle;
    var now = Date.now();
    document.getElementById('sheetTitle').textContent = titleOf(s);
    var rows = [
      ['상태', '<span class="pill" style="background:' + st.color + '">' + st.label + '</span> ' + ago(s.stateSince, now) + ' 전부터'],
      roleOf[s.id] ? ['회의 역할', esc(roleOf[s.id])] : null,
      s.synthetic ? ['방', esc(s.room) + ' · 회의 상태 파일 기준 (' + esc(s.agent || '에이전트') + ')'] : ['방', esc(s.room) + (s.app === 'chat' ? ' · 채팅 UI' : ' · 터미널')],
      s.cwd ? ['폴더', esc(s.cwd)] : null,
      s.waitingFor ? ['기다리는 것', esc(s.waitingFor)] : null,
      s.errorText ? ['오류', esc(s.errorText)] : null,
      s.tool ? ['도구', esc(s.tool)] : null,
      s.lastPrompt ? ['마지막 요청', esc(s.lastPrompt)] : null,
      s.lastMessage ? ['마지막 답변', esc(s.lastMessage)] : null,
      (s.subagents && s.subagents.length) ? ['워커', esc(s.subagents.map(function (a) { return a.type; }).join(', '))] : null,
      [s.synthetic ? '갱신' : '시작', esc(clock(s.startedAt))],
      s.synthetic ? null : ['세션 ID', '<code>' + esc(s.id) + '</code>']
    ].filter(Boolean);
    document.getElementById('sheetBody').innerHTML = rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('');
    document.querySelector('.sheet .actions').style.display = s.synthetic ? 'none' : '';
    document.getElementById('resumeCmd').value = s.synthetic ? '' : 'cd "' + s.cwd + '"; claude --resume ' + s.id;
  }
  function openSheet(id) {
    openId = id;
    fillSheet(id);
    document.getElementById('scrim').classList.add('open');
    document.getElementById('sheetClose').focus();
  }
  function closeSheet() {
    openId = null;
    document.getElementById('scrim').classList.remove('open');
  }

  // ---------- 3D 사무실 ----------
  // 2D/3D 단추로 바꾼다. 처음 3D 를 켤 때 office3d.js 를 불러오고, 그 안에서 Three.js 와 사람 모델(models/)을 불러온다.
  // 자리 배치(layoutRoom)와 말풍선 내용(bubbleFor)은 2D 와 같은 것을 장면 정보로 넘긴다.
  var HINT_2D = '회의실을 누르면 안으로 들어가 각자 하는 말과 회의록을 볼 수 있어요. 화이트보드 = 회의 안건, 책상 명패 = 세션, 의자 등받이 글씨 = 워커 종류예요.';
  var HINT_3D = '3D에서는 사람이 실제 상태대로 움직여요. 일하는 중이면 자리에서 타자, 승인·답변 대기면 로비의 대표 자리로 와서 줄 서고, 막히면 일어서요. 로봇은 워커예요. 5분 넘게 쉬는 세션은 가끔 커피·소파로 다녀와요. 방을 누르면 들어가 회의록을 봐요.';
  var dim = '2d';
  try { dim = localStorage.getItem('workroom-dim') === '3d' ? '3d' : '2d'; } catch (_) {}
  // 링크에 ?d=3d (또는 2d) 를 붙이면 그 보기로 연다
  var dimQuery = /[?&]d=(2d|3d)\b/.exec(location.search);
  if (dimQuery) { dim = dimQuery[1]; try { localStorage.setItem('workroom-dim', dim); } catch (_) {} }
  var office3dEl = document.getElementById('office3d');
  var o3 = null, o3Loading = false;

  function cssColor(v) {
    var m = /^var\((--[\w-]+)\)$/.exec(v || '');
    return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : v;
  }
  function darkTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function scene3d(now) {
    var info = speechInfo();
    var sessions = data.sessions || [];
    var rooms = roomsView().map(function (room) {
      var list = sessions.filter(function (s) { return s.room === room.name; });
      var mt = roomMeeting(room.name);
      var k = seatsPerRow(list, room.kind, mt);
      var L = withGeo(interiorGeo(k), function () { return layoutRoom(list, room.kind, mt); });
      var people = [];
      function add(p, row, i) {
        if (!p) return;
        if (p.worker) {
          people.push({ id: 'w:' + p.seed, worker: true, type: p.type, parent: p.parent.id, row: row, seat: i, name: p.type, state: 'working', color: personColor(p.parent.id) });
          return;
        }
        var s = p.s;
        people.push({ id: s.id, row: row, seat: i, name: p.label || fit(titleOf(s), 12), title: titleOf(s), chair: !!p.chair, state: s.state, since: s.stateSince || 0,
          color: personColor(s.id), look: look(s.id), bubble: bubbleFor(s, info[s.id], now) });
      }
      L.far.forEach(function (p, i) { add(p, 'far', i); });
      L.near.forEach(function (p, i) { add(p, 'near', i); });
      var st = roomStatus(L.mains.map(function (m) { return m.s; }), L.people, mt);
      return {
        name: room.name, no: room.no, label: room.label, machine: room.machine, kind: room.kind, k: k, overflow: L.overflow,
        status: { label: st.label, color: cssColor(st.color), blink: !!st.blink },
        alert: list.some(function (s) { return s.state === 'approval' || s.state === 'question'; }) || !!(mt && mt.waitingForUser),
        meeting: mt ? { agenda: mt.agenda, phase: roundPhase(mt), waiting: !!mt.waitingForUser } : null,
        people: people
      };
    });
    var colors = {}, labels = {};
    Object.keys(STATE).forEach(function (k) { colors[k] = cssColor(STATE[k].color); labels[k] = STATE[k].label; });
    return {
      now: now, hour: new Date(now).getHours(), dark: darkTheme(), focus: zoomRoom, rooms: rooms, colors: colors, labels: labels, self: selfName(),
      machines: (data.machines || []).map(function (m) { return { name: m.name, ago: ago(m.generatedAt, now) || '0초' }; })
    };
  }
  function render3d(now) {
    if (dim === '3d' && o3 && data) o3.update(scene3d(now));
  }
  var host3d = {
    room: function (name) { if (zoomRoom === name) return; if (zoomRoom) leaveRoomNow(); enterRoom(name); },
    person: function (id) { openSheet(id); },
    speech: function (id) { cardSid = id; lastCardKey = ''; renderSpeechCard(); },
    back: function () { exitRoom(); }
  };
  // 애니메이션 없이 바로 회의실에서 나온다 (2D/3D 바꿀 때, 3D 에서 나갈 때).
  function leaveRoomNow() {
    if (!zoomRoom) return;
    zoomRoom = null; logData = null; cardSid = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    stage.classList.remove('zoomed');
    roomView.classList.remove('show');
    roomView.hidden = true;
    roomView.innerHTML = '';
    office.style.transform = '';
    stage.style.height = '';
    renderSide();
  }
  function markDim() {
    document.querySelectorAll('#dimSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-dim') === dim); });
    document.getElementById('viewSeg').hidden = dim === '3d';
    office.hidden = dim === '3d';
    office3dEl.hidden = dim !== '3d';
    document.getElementById('legendHint').textContent = dim === '3d' ? HINT_3D : HINT_2D;
  }
  function loadScript(src, done) {
    var el = document.createElement('script');
    el.src = src;
    el.onload = function () { done(true); };
    el.onerror = function () { el.remove(); done(false); };
    document.head.appendChild(el);
  }
  function addCard3d() {
    if (!document.getElementById('speechCard')) office3dEl.insertAdjacentHTML('beforeend', '<div class="speech-card" id="speechCard" role="dialog" aria-label="최근에 한 말" hidden></div>');
  }
  function start3d() {
    if (o3) { addCard3d(); o3.show(true); return; }
    if (o3Loading) return;
    o3Loading = true;
    office3dEl.innerHTML = '<div class="o3-msg">3D 사무실을 불러오는 중…</div>';
    var fail = function (why) {
      o3Loading = false;
      office3dEl.innerHTML = '<div class="o3-msg">' + esc(why) + '<br>위의 2D 단추로 평면도를 볼 수 있어요.</div>';
    };
    var ready = function (api) {
      office3dEl.innerHTML = '';
      try { o3 = api.mount(office3dEl, host3d); }
      catch (e) { fail('이 브라우저에서는 3D(WebGL)를 쓸 수 없어요.'); return; }
      o3Loading = false;
      if (dim !== '3d') return;
      addCard3d();
      o3.show(true);
      render3d(Date.now());
    };
    var start = function () {
      window.Office3D.load().then(ready, function () { fail('3D 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); });
    };
    if (window.Office3D) start();
    else loadScript('office3d.js', function (ok) { if (ok && window.Office3D) start(); else fail('3D 화면 파일(office3d.js)을 불러오지 못했어요.'); });
  }
  function stop3d() {
    if (o3) o3.show(false);
    var card = office3dEl.querySelector('#speechCard');
    if (card) card.remove();
  }
  function setDim(next) {
    if (next === dim) return;
    leaveRoomNow();
    dim = next;
    try { localStorage.setItem('workroom-dim', dim); } catch (_) {}
    markDim();
    if (dim === '3d') start3d(); else stop3d();
    lastScene = '';
    render();
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'scrim') { closeSheet(); return; }
    var db = e.target.closest('#dimSeg button');
    if (db) { setDim(db.getAttribute('data-dim')); return; }
    if (e.target.closest('.sheet')) return;
    if (e.target.closest('#rvBack') || e.target.closest('.rv-door')) { exitRoom(); return; }
    if (e.target.closest('.sc-close')) { cardSid = null; renderSpeechCard(); return; }
    var bub = e.target.closest('.sb');
    if (bub) { cardSid = bub.getAttribute('data-id'); lastCardKey = ''; renderSpeechCard(); return; }
    if (cardSid && !e.target.closest('.speech-card')) { cardSid = null; renderSpeechCard(); }
    // 평면도에서는 방 어디를 눌러도 그 회의실로 들어간다.
    var cell = e.target.closest('.room-cell');
    if (cell && !zoomRoom) { if (cell.getAttribute('data-room')) enterRoom(cell.getAttribute('data-room')); return; }
    var more = e.target.closest('.m-more');
    if (more) { var k = more.getAttribute('data-k'); if (expanded[k]) delete expanded[k]; else expanded[k] = true; renderMinutes(true); return; }
    var seg = e.target.closest('.seg button');
    if (seg) {
      minFilter = seg.getAttribute('data-filter');
      document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b === seg); });
      renderMinutes(true);
      return;
    }
    if (e.target.closest('#saveMin')) { saveMinutes(); return; }
    var vb = e.target.closest('.viewseg button');
    if (vb) {
      viewMode = vb.getAttribute('data-view');
      try { localStorage.setItem('workroom-view', viewMode); } catch (_) {}
      markView();
      lastScene = '';
      render();
      return;
    }
    var t = e.target.closest('[data-id]');
    if (t) openSheet(t.getAttribute('data-id'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (document.getElementById('scrim').classList.contains('open')) closeSheet();
      else if (cardSid) { cardSid = null; renderSpeechCard(); }
      else if (zoomRoom) exitRoom();
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches) {
      if (e.target.matches('.room-cell[data-room]') && !zoomRoom) { e.preventDefault(); enterRoom(e.target.getAttribute('data-room')); return; }
      if (e.target.matches('g[data-id]')) { e.preventDefault(); openSheet(e.target.getAttribute('data-id')); }
    }
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('copyBtn').addEventListener('click', function () {
    var input = document.getElementById('resumeCmd');
    var btn = this;
    var done = function () { btn.textContent = '복사됨'; setTimeout(function () { btn.textContent = '명령 복사'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(input.value).then(done, function () { input.select(); document.execCommand('copy'); done(); });
    } else { input.select(); document.execCommand('copy'); done(); }
  });

  // 화면 배치: 꽉 차게, 패널 왼쪽/오른쪽, 패널 숨김, 패널 폭(가장자리를 끌어서). 이 브라우저에 기억해 둔다.
  var LAYOUT_KEY = 'workroom-layout';
  var lay = { full: false, side: 'right', hide: false, w: 320 };
  try { Object.assign(lay, JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}')); } catch (_) {}
  function applyLayout(save) {
    document.body.classList.toggle('full', !!lay.full);
    document.body.classList.toggle('side-left', lay.side === 'left');
    document.body.classList.toggle('side-hide', !!lay.hide);
    document.documentElement.style.setProperty('--side-w', Math.round(lay.w) + 'px');
    document.querySelectorAll('#layoutSeg button').forEach(function (b) {
      var k = b.getAttribute('data-lay');
      b.classList.toggle('on', k === 'full' ? !!lay.full : k === 'side' ? lay.side === 'left' : !!lay.hide);
    });
    if (save) {
      try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(lay)); } catch (_) {}
      window.dispatchEvent(new Event('resize'));
    }
  }
  applyLayout(false);
  document.getElementById('layoutSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lay]');
    if (!b) return;
    var k = b.getAttribute('data-lay');
    if (k === 'full') lay.full = !lay.full;
    else if (k === 'side') { lay.side = lay.side === 'left' ? 'right' : 'left'; lay.hide = false; }
    else lay.hide = !lay.hide;
    applyLayout(true);
  });
  (function () {
    var grip = document.getElementById('sideGrip'), start = null;
    grip.addEventListener('pointerdown', function (e) {
      start = { x: e.clientX, w: lay.w };
      grip.setPointerCapture(e.pointerId);
      grip.classList.add('drag');
      e.preventDefault();
    });
    grip.addEventListener('pointermove', function (e) {
      if (!start) return;
      var dx = e.clientX - start.x;
      lay.w = Math.max(240, Math.min(720, start.w + (lay.side === 'left' ? dx : -dx)));
      document.documentElement.style.setProperty('--side-w', Math.round(lay.w) + 'px');
    });
    function end() { if (!start) return; start = null; grip.classList.remove('drag'); applyLayout(true); }
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  })();

  var themeKey = 'workroom-theme';
  function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  try { applyTheme(localStorage.getItem(themeKey)); } catch (_) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(themeKey, next); } catch (_) {}
    render3d(Date.now());
  });

  document.getElementById('legend').innerHTML = ['working', 'approval', 'question', 'done', 'error', 'idle'].map(function (k) {
    return '<span><i style="background:' + STATE[k].color + '"></i>' + STATE[k].label + '</span>';
  }).join('');

  markView();
  markDim();
  if (dim === '3d') start3d();
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { lastScene = ''; lastRoomScene = ''; render(); }, 120);
  });

  function loadSpeech() {
    var el = document.createElement('script');
    el.src = 'speech.js?t=' + Date.now();
    el.onload = function () {
      el.remove();
      speechData = window.__WORKROOM_SPEECH__ || null;
      var now = Date.now();
      if (dim === '3d') render3d(now);
      else {
        renderPlanBubbles(now);
        if (zoomRoom) renderRoomView(now);
      }
    };
    el.onerror = function () { el.remove(); };
    document.head.appendChild(el);
  }

  // state.js 를 1.5초마다 다시 읽는다 (file:// 에서도 동작하도록 script 태그로 읽음).
  function poll() {
    var el = document.createElement('script');
    el.src = 'state.js?t=' + Date.now();
    el.onload = function () {
      el.remove();
      if (window.__WORKROOM__) {
        data = window.__WORKROOM__;
        lastLoadOk = Date.now();
        document.getElementById('banner').innerHTML = '';
      }
      render();
      loadSpeech();
      if (zoomRoom) loadRoomLog();
      // 주소 끝에 #room=방이름 이 있으면 그 회의실로 바로 들어간다.
      if (!hashChecked && data) {
        hashChecked = true;
        var m = location.hash.match(/^#room=(.+)$/);
        if (m) enterRoom(decodeURIComponent(m[1]));
      }
    };
    el.onerror = function () {
      el.remove();
      if (!data) {
        document.getElementById('banner').innerHTML = '<div class="banner"><b>아직 기록이 없어요.</b> Claude Code 세션에서 아무 요청이나 한 번 보내면 현황판이 채워져요.</div>';
        document.getElementById('sub').textContent = '기록 대기 중';
      }
    };
    document.head.appendChild(el);
  }
  poll();
  setInterval(poll, 1500);
})();
</script>
</body>
</html>
